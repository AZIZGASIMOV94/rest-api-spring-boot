# MySQL "employees" sample database (https://github.com/datacharmer/test_db)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employees}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# The schema belongs to the sample database: never let Hibernate change it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Keep page sizes reasonable - the employees table has 300,000 rows
spring.data.web.pageable.max-page-size=100
